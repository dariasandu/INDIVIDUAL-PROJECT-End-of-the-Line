<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one handheld-style bezel holding a pixel canvas; on phones it becomes an original handheld shell: screen bezel up top, D-pad, A/B, pills. Single dark look by choice. */
:root{
  --ground:#0d1124; --bezel:#26304f; --bezel-hi:#3a4a74; --bezel-lo:#171e36;
  --ink:#f8e6b4; --muted:#9fb0dc; --key:#f2b33a; --key-lo:#b97a1e; --out:#0a0d1c;
  --font:'Silkscreen', ui-monospace, 'Courier New', monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--ground); color:var(--ink); font-family:var(--font);
  margin:0; overflow:hidden; box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px;
  display:flex; align-items:center; justify-content:center;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.bezel{
  background:var(--bezel); padding:8px 10px 10px; border-radius:8px;
  box-shadow:0 0 0 3px var(--out), inset 0 2px 0 var(--bezel-hi), inset 0 -3px 0 var(--bezel-lo);
  display:flex; flex-direction:column; gap:6px; max-width:100%; min-width:0;
}
.bezel-top{display:flex; justify-content:space-between; gap:12px; font-size:10px; letter-spacing:.14em; color:var(--muted); padding-inline:2px}
.bezel-top b{color:var(--key); font-weight:400}
canvas{display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; outline:none; box-shadow:0 0 0 2px var(--out); touch-action:none; max-width:100%}
canvas:focus-visible{box-shadow:0 0 0 2px var(--key)}
/* ---- desktop: screen wrapper is invisible ---- */
.swrap{display:contents} .scr-top,.brand{display:none}
/* ---- phone: an original handheld shell (cream body, dark screen bezel, D-pad, A/B, pills, grille) ---- */
:root{--shell:#d8d2c2; --shell-hi:#ece7da; --shell-lo:#b3ac9b; --shell-ink:#3a3f68; --scr-bezel:#454a63; --scr-bezel-lo:#2f3346; --dpad:#25283a; --ab-c:#3a78c8; --ab-lo:#1f4a86; --pill:#8f8b80; --led:#ff4a5a}
body.touch{padding-block:6px; touch-action:none; overscroll-behavior:none}
body.touch .bezel{background:var(--shell); border-radius:12px 12px 48px 12px; padding:8px 8px 14px; gap:0;
  box-shadow:0 0 0 3px var(--out), inset 0 3px 0 var(--shell-hi), inset -4px -6px 0 var(--shell-lo); width:100%; max-width:560px}
body.touch:not(.land) .pad{flex:1; align-content:space-evenly; padding-top:8px}
body.touch .bezel-top{display:none}
body.touch .swrap{display:block; background:var(--scr-bezel); border-radius:8px 8px 26px 8px; padding:6px 7px 10px;
  box-shadow:inset 0 -3px 0 var(--scr-bezel-lo), 0 0 0 2px var(--out)}
body.touch .scr-top{display:flex; align-items:center; gap:6px; height:10px; margin-bottom:5px; font-size:7px; letter-spacing:.16em; color:#a9add0}
body.touch .scr-top .ln{flex:1; height:2px; background:linear-gradient(#3a78c8 0 1px,#6aa6e8 1px 2px)}
body.touch .led{width:7px; height:7px; border-radius:50%; background:var(--led); box-shadow:0 0 6px var(--led); flex:none}
body.touch canvas{margin-inline:auto; box-shadow:0 0 0 2px #15182a}
body.touch .brand{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; column-gap:8px; row-gap:2px; margin:8px 4px 2px; color:var(--shell-ink); font-size:13px; letter-spacing:.06em; transform:skewX(-10deg); white-space:nowrap}
body.touch .brand b{font-weight:400; color:var(--ab-c)}
body.touch .brand small{font-size:7px; letter-spacing:.08em; color:#6a6f90; transform:skewX(10deg)}
body.land .brand small{display:none}
.pad{display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:"dpad . acts" "sys sys sys" "grille grille grille"; align-items:center; row-gap:12px; padding-top:16px; touch-action:none}
/* D-pad (sized by --dp) */
.dpad{grid-area:dpad; --dp:120px; width:var(--dp); height:var(--dp); position:relative; touch-action:none; margin-left:4px}
.dpad .arm{position:absolute; background:var(--dpad); box-shadow:0 0 0 3px var(--out)}
.dpad .h{left:0; right:0; top:33.33%; height:33.34%; border-radius:6px}
.dpad .v{top:0; bottom:0; left:33.33%; width:33.34%; border-radius:6px}
.dpad .hub{position:absolute; left:33.33%; top:33.33%; width:33.34%; height:33.34%; background:var(--dpad)}
.dpad .hub::after{content:""; position:absolute; inset:30%; border-radius:50%; background:#1a1c29}
.dpad .tri{position:absolute; width:0; height:0; border:7px solid transparent; opacity:.55}
.dpad .tu{left:calc(50% - 7px); top:6%; border-bottom-color:#6a6f90} .dpad .td{left:calc(50% - 7px); bottom:6%; border-top-color:#6a6f90}
.dpad .tl{top:calc(50% - 7px); left:6%; border-right-color:#6a6f90} .dpad .tr{top:calc(50% - 7px); right:6%; border-left-color:#6a6f90}
.dpad .glow{position:absolute; width:33.34%; height:33.34%; border-radius:6px; background:rgba(255,255,255,.14); opacity:0; pointer-events:none}
.dpad .gu{left:33.33%; top:0} .dpad .gd{left:33.33%; bottom:0} .dpad .gl{left:0; top:33.33%} .dpad .gr{right:0; top:33.33%}
.dpad.u .gu,.dpad.d .gd,.dpad.l .gl,.dpad.r .gr{opacity:1}
/* action cluster (sized by --sk skill buttons and --ab A/B) */
.acts{grid-area:acts; --sk:44px; --ab:56px; display:grid; grid-template-columns:repeat(3,var(--sk)); grid-template-rows:var(--sk) calc(var(--ab) + 16px); column-gap:10px; row-gap:16px; align-items:center; margin-right:2px; pointer-events:none}
.acts button{pointer-events:auto}
.acts button,.sys button{font-family:var(--font); border:0; padding:0; touch-action:none; -webkit-tap-highlight-color:transparent; position:relative; overflow:hidden; color:var(--out)}
.sys button{overflow:visible} .sys button::after{content:''; position:absolute; inset:-14px -10px}
.sk{width:var(--sk); height:var(--sk); border-radius:50%; background:#f2b33a; box-shadow:0 0 0 3px var(--out), inset 0 -4px 0 #b97a1e; display:flex; flex-direction:column; align-items:center; justify-content:center}
.sk img{width:calc(var(--sk)*.5); height:calc(var(--sk)*.5); image-rendering:pixelated; pointer-events:none}
.sk span{font-size:calc(var(--sk)*.16); line-height:1; pointer-events:none; margin-top:1px}
.sk i{position:absolute; inset:auto 0 0 0; height:var(--cd,0%); background:rgba(10,13,28,.6); pointer-events:none}
.sk.low{filter:saturate(.3) brightness(.8)}
.sk.ult{background:#cfe4f8; box-shadow:0 0 0 3px var(--out), inset 0 -4px 0 #8ab0d8}
.ab{grid-column:1 / -1; display:flex; justify-content:center; gap:14px; transform:rotate(-20deg); transform-origin:center; margin-top:12px; pointer-events:none}
.rb{width:var(--ab); height:var(--ab); border-radius:50%; background:var(--ab-c); box-shadow:0 0 0 3px var(--out), inset 0 -5px 0 var(--ab-lo); color:#fff4f8 !important; font-size:18px; display:flex; flex-direction:column; align-items:center; justify-content:center}
.rb small{font-size:7px; letter-spacing:.08em; margin-top:2px; pointer-events:none}
.rb span{pointer-events:none}
.ab .a{transform:translateY(-8px)}
/* start/select style pills */
.sys{grid-area:sys; display:flex; justify-content:center; gap:26px; pointer-events:none}
.sys button{pointer-events:auto}
.sys label{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:10px; letter-spacing:.14em; color:var(--shell-ink); transform:rotate(-22deg)}
.pill{width:var(--pw,58px); height:calc(var(--pw,58px)*.3); border-radius:9px; background:var(--pill); box-shadow:0 0 0 2px var(--out), inset 0 -3px 0 #6b685f}
.pill[disabled]{opacity:.45}
.grille{grid-area:grille; justify-self:end; display:flex; gap:7px; transform:rotate(-28deg); margin:4px 18px 0 0}
.grille i{width:5px; height:40px; border-radius:3px; background:var(--shell-lo); box-shadow:inset 1px 1px 0 rgba(0,0,0,.18)}
.acts button.on,.sys button.on{transform:translateY(2px); filter:brightness(.9)}
.ab .a.on{transform:translateY(-6px)}
/* landscape: a wide handheld */
body.land .bezel{display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"left screen right"; align-items:center; column-gap:6px; max-width:none; border-radius:32px; padding:4px 8px}
body.land .pad{display:contents}
body.land .swrap{grid-area:screen; padding:4px 6px 6px; border-radius:8px 8px 18px 8px}
body.land .scr-top{height:8px; margin-bottom:3px}
body.land .dpad{--dp:102px; margin-left:0}
body.land .acts{--sk:36px; --ab:48px; column-gap:calc(var(--sk)*.2); row-gap:22px}

body.land .rb{font-size:15px}
body.land .sys{gap:12px}
body.land .brand{display:none}
body.land .leftcol{grid-area:left; display:flex; flex-direction:column; align-items:center; gap:calc(var(--dp,120px)*.32)}
body.land .acts{grid-area:right}
body.land .grille{display:none}
.leftcol{display:contents}
/* buttons scale their labels with their size */
.rb{font-size:calc(var(--ab)*.3)} .rb small{font-size:calc(var(--ab)*.12)} body.land .rb{font-size:calc(var(--ab)*.3)}
.sys label{font-size:calc(var(--pw,58px)*.17)}
/* phones: thinner edges so the screen gets more width */
body.touch{padding-left:max(3px, env(safe-area-inset-left, 0px)); padding-right:max(3px, env(safe-area-inset-right, 0px))}
body.touch:not(.land) .bezel{padding:4px 4px 12px}
body.touch:not(.land) .swrap{padding:4px 3px 7px}
/* portrait: skills get their own row across the top, so the D-pad and A/B can be big underneath */
body.touch:not(.land) .pad{grid-template-columns:1fr 1fr 1fr; grid-template-areas:none; row-gap:var(--rg,18px); padding-top:var(--pt,14px); align-items:center}
body.touch:not(.land) .acts{display:contents}
body.touch:not(.land) .acts > .sk{grid-row:1; justify-self:center}
body.touch:not(.land) .acts > .sk:nth-of-type(1){grid-column:1} body.touch:not(.land) .acts > .sk:nth-of-type(2){grid-column:2} body.touch:not(.land) .acts > .sk:nth-of-type(3){grid-column:3}
body.touch:not(.land) .dpad{grid-row:2; grid-column:1 / 3; justify-self:start; margin-left:6px}
body.touch:not(.land) .ab{grid-row:2; grid-column:2 / 4; justify-self:end; margin:0 4px 0 0; gap:calc(var(--ab)*.16)}
body.touch:not(.land) .sys{grid-row:3; grid-column:1 / 4; gap:calc(var(--pw,58px)*.6)}
body.touch:not(.land) .grille{display:none}
@media (prefers-reduced-motion: reduce){ .btns button:active{transform:none} }
</style>

      </div>
    </div>
    <div class="grille" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</div>

let CUR=null; // hero currently acting (for MP and damage credit)
const ang=h=>Math.atan2(h.face.y,h.face.x);
function slash(h,r,col,sp,w=3){G.fx.push({type:'arc',x:h.x,y:h.y-9,a:ang(h),r,sp,t:0,max:10,col,w});}
function ring(x,y,r0,r1,col,max=16,w=2){G.fx.push({type:'ring',x,y,r0,r1,col,t:0,max,w});}
function tele(x,y,r,max,col='#ffe070'){G.fx.push({type:'tele',x,y,r,t:0,max,col});}
function sched(t,f){G.sched.push({t,f,src:CUR});}
function shoot(h,a,o){G.projs.push({x:h.x+Math.cos(a)*6,y:h.y+Math.sin(a)*4,vx:Math.cos(a)*o.spd,vy:Math.sin(a)*o.spd,r:o.r||3,dmg:o.dmg,o:o.o||{},life:o.life||70,pierce:o.pierce,kind:o.kind,hits:new Set(),home:o.home,onHit:o.onHit,onEnd:o.onEnd,pz:9,src:h});}
function ahead(h,d){return {x:clamp(h.x+h.face.x*d,BX0,BX1),y:clamp(h.y+h.face.y*d,BY0,BY1)};}
function targetPoint(h,d){const e=nearestEnemy(h.x,h.y,150);return e?{x:e.x,y:e.y}:ahead(h,d);}
function muzzle(h,big){const a=ang(h);G.fx.push({type:'flash',x:h.x+Math.cos(a)*14,y:h.y-9+Math.sin(a)*6,t:0,max:big?8:5,r:big?7:4});}
function gunshot(h,a,dmg){muzzle(h,false);shoot(h,a,{spd:6.5,dmg,kind:'bullet',life:48,r:3,o:{kb:1.4,mp:5,stun:16}});sfx('gun');}
function explode(x,y){strike(x,y,34,34,{burn:140,kb:3,launch:2.6,hs:4,shake:3,mp:4,col:'#ffb040'});ring(x,y,4,36,'#ff9a30',14,3);for(let i=0;i<14;i++)part(x,y,{vx:rnd(-2,2),vy:rnd(-1.5,1.5),vz:rnd(.5,3),col:pick(['#ff9a30','#e0483e','#ffe070']),life:26});sfx('boom2');}

function disc(g,cx,cy,r,col){g.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy)+.5);g.fillRect(Math.round(cx-w),Math.round(cy+dy),2*w+1,1);}}
function tree(g,x,y,r=11){
  g.fillStyle=OUT;g.fillRect(x-4,y+3,9,13);g.fillRect(x-6,y+13,13,4);
  g.fillStyle='#e9d9b2';g.fillRect(x-3,y+4,7,11);g.fillRect(x-5,y+14,11,2);
  g.fillStyle='#c2a47c';g.fillRect(x+1,y+4,3,11);g.fillRect(x+2,y+14,3,2);
  disc(g,x,y,r+1,'#22381f');disc(g,x,y,r,'#3a6e30');disc(g,x-1,y-2,r-2,'#4f8a38');disc(g,x-3,y-4,r-6,'#6aa63e');
  for(let k=0;k<7;k++){const a=rnd(0,TAU),rr=rnd(2,r-3),tx=Math.round(x+Math.cos(a)*rr),ty=Math.round(y+Math.sin(a)*rr-1);g.fillStyle='#c8d84a';g.fillRect(tx-1,ty,1,1);g.fillRect(tx+1,ty,1,1);g.fillRect(tx,ty+1,1,1);g.fillStyle='#eef070';g.fillRect(tx,ty,1,1);}
}

function hullHH(x){ // half-height of the deck outline at column x, 0 = off the boat
  if(x<18||x>BOWE)return 0;
  if(x<70){const t=(70-x)/52;return HHB*Math.sqrt(Math.max(0,1-t*t*t*t));}
  if(x<BOW)return HHB;
  const t=(x-BOW)/(BOWE-BOW);return HHB*Math.sqrt(Math.max(0,1-t*t));
}
const inHull=(x,y,k=0)=>{const hh=hullHH(x+(x>BOW?k*1.4:0))-k;return hh>0&&Math.abs(y-SHIPCY)<=hh&&x>=18+k;};
const sideH=x=>{const hh=hullHH(x);return hh>0?Math.round(24*Math.pow(hh/HHB,.6)):0;};
const onBoat=(x,y,k=0)=>inHull(x,y,k)||(hullHH(x)>0&&y>SHIPCY&&y<=SHIPCY+hullHH(x)+sideH(x)+k);

function nearestEnemy(x,y,max){let b=null,bd=max;for(const e of G.enemies){if(e.dead||e.spawn>0)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;b=e;}}return b;}

function flowDir(e){const k=G.t>>3;if(k!==flowK){flowK=k;buildFlow();}
  let cx=clamp(Math.floor(e.x/MS),0,MAPW-1),cy=clamp(Math.floor(e.y/MS),0,MAPH-1),i=cy*MAPW+cx;if(!WALKM[i])i=NEAR[i];const d0=FLOWD[i];if(d0<=0)return null;

function steer(e,ux,uy){const h=nearestHero(e.x,e.y);if(h&&!clearPath(e.x,e.y,h.x,h.y)){const f=flowDir(e);if(f)return f;}let x=ux,y=uy;for(const b of OBS){const dx=b.x-e.x,dy=b.y-e.y,d=Math.hypot(dx,dy);if(d>b.r+e.rad+16)continue;if((dx*ux+dy*uy)/d<.2)continue;const side=(dx*uy-dy*ux)>0?1:-1;x+=-dy/d*side*1.2;y+=dx/d*side*1.2;}const m=Math.hypot(x,y)||1;return{x:x/m,y:y/m};}

function hurtEnemy(e,dmg,o,sx,sy,src){

  else if(auto){const e=nearestEnemy(h.x,h.y,95);if(e){const dx=e.x-h.x,dy=e.y-h.y,d=Math.hypot(dx,dy)||1;h.face={x:dx/d,y:dy/d};}}

function aiEnemy(e,h){

  if(TOUCH&&land){const vh=innerHeight,pw=clamp(vh*.16,50,72),extra=pw*.3+pw*.17+40;// pills, their labels and the tilt
    let dp=clamp(vh*.34,104,170);const room=vh-16-extra;if(dp*1.32>room)dp=Math.max(84,room/1.32);
    setPad(dp,clamp(vh*.13,44,60),clamp(vh*.19,58,86),pw);bezel.style.minHeight=Math.round(Math.min(vh-6,dp*1.32+extra+8))+'px';}
  if(TOUCH&&!land)bezel.style.minHeight=(innerHeight-18)+'px';
  let aw,ah;
  if(!TOUCH){aw=innerWidth-32-24;ah=innerHeight-20-40;}
  else{
    const cs=getComputedStyle(swrap),px=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
    const overH=bezel.offsetHeight-cv.offsetHeight;
    if(land){const side=(document.querySelector('.leftcol .dpad').offsetWidth)+(document.querySelector('.acts').offsetWidth);
      const bs=getComputedStyle(bezel);aw=innerWidth-6-side-18-px-parseFloat(bs.paddingLeft)-parseFloat(bs.paddingRight)-8;
      ah=innerHeight-14-(swrap.offsetHeight-cv.offsetHeight)-parseFloat(bs.paddingTop)-parseFloat(bs.paddingBottom)-6;}
    else{aw=swrap.clientWidth-px;ah=Math.max(120,innerHeight*.45);}
  }
  let s=Math.min(aw/W,ah/H);if(!TOUCH&&s>=2)s=Math.floor(s);s=Math.max(.5,s);
  cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
  if(TOUCH&&!land){ // the controls take whatever room is left under the screen, as big as the width allows
    const win=bezel.clientWidth-16,padH=innerHeight-12-(swrap.offsetHeight+document.getElementById('brand').offsetHeight+40);
    const dp=clamp(Math.min(win*.46,padH*.46),120,230),ab=clamp(Math.min((win-dp)*.42,padH*.24),62,112),sk=clamp(Math.min(win*.19,padH*.17),52,86);
    setPad(dp,sk,ab,clamp(win*.2,62,96));
    const used=sk+dp+clamp(win*.2,62,96)*.5+40,spare=Math.max(0,padH-used);pad.style.setProperty('--rg',Math.round(clamp(spare/4,14,40))+'px');pad.style.setProperty('--pt',Math.round(clamp(spare/4,10,34))+'px');}
}

let KNIFE_IMG=null;
const ICONURL=new Map();
function iconURL(d,i){const k=d.id+i;if(!ICONURL.has(k)){const im=d.icons[i],[c,g]=mk(im.width*4,im.height*4);g.imageSmoothingEnabled=false;g.drawImage(im,0,0,c.width,c.height);ICONURL.set(k,c.toDataURL());}return ICONURL.get(k);}
const SKB=['TouchS1','TouchS2','TouchU'].map(k=>document.querySelector(`[data-k=${k}]`)),SWB=document.querySelector('[data-k=TouchSw]');
let padHero;

  SWB.disabled=!(h&&G.mode===1);SWB.closest('label').style.opacity=SWB.disabled?.55:1;

cv.addEventListener('pointerdown',e=>{
  initAudio();cv.focus();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(G.state==='title'){if(!MOBILE)for(let i=0;i<2;i++){const r=TBTN[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h&&G.menu!==i){G.menu=i;sfx('select');return;}}hit.add('Enter');}
  else if(G.state==='select'&&G.mode===2&&SELHIT.some(h=>x>=h.r.x&&x<=h.r.x+h.r.w&&y>=h.r.y&&y<=h.r.y+h.r.h&&(h.f(),true))){}
  else if(G.state==='select'&&G.mode===1&&[PICKB,PREVB,NEXTB].some(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)){const sl=G.sel[0];
    if(x>=PICKB.x&&x<=PICKB.x+PICKB.w&&y>=PICKB.y&&y<=PICKB.y+PICKB.h)hit.add(G.mode===1?'Enter':'TouchA');
    else if(!(G.mode===2&&sl.ready)){sl.cur=(sl.cur+(x<PICKB.x?3:1))%4;if(G.mode===2)G.selFocus=0;sfx('select');}}
  else if(G.state==='select'&&G.mode===2){for(let i=0;i<4;i++){const t=SELT[i];if(x>=t.x&&x<=t.x+t.w&&y>=t.y&&y<=t.y+t.h){const p=G.sel[0].ready?1:0,sp=G.sel[p];if(sp.ready)return;if(sp.cur===i)selAct(p,'pick');else{sp.cur=i;G.selFocus=p;sfx('select');}return;}}}
  else if(G.state==='select'&&G.mode===1&&SKBOX.some((b,i)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h&&((G.skSel=i),true))){sfx('select');}
  else if(G.state==='select'&&G.mode===1&&x>=STARTB.x&&x<=STARTB.x+STARTB.w&&y>=STARTB.y&&y<=STARTB.y+STARTB.h){if(G.sel[0].picks.length===2)G.startNow=true;else sfx('deny');}
  else if(G.state==='select'&&G.mode===1){for(let i=0;i<4;i++){const t=SELT[i];if(x>=t.x&&x<=t.x+t.w&&y>=t.y&&y<=t.y+t.h){if(G.sel[0].cur===i)hit.add('Enter');else{G.sel[0].cur=i;sfx('select');}return;}}}
  else if(G.state==='play'){if(x>=PBTN.x-2&&x<=PBTN.x+PBTN.w+24&&y>=PBTN.y-2&&y<=PBTN.y+PBTN.h+2)openPause();}
  else if(G.state==='gift'){if(G.giftT<20)return;for(let i=0;i<3;i++){const r=GCARD(i);if(x>=r.x&&x<=r.x+r.w&&y>=r.y-4&&y<=r.y+r.h){if(G.gsel===i||TOUCH)takeGift(i);else G.gsel=i;return;}}}
  else if(G.state==='over'){for(let i=0;i<2;i++){const r=OBTN[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){G.omenu=i;hit.add('Enter');return;}}}
  else if(G.state==='pause'&&G.pOpt){for(let i=0;i<2;i++){const r=OROW(i);if(x>=r.x-8&&x<=r.x+r.w+8&&y>=r.y-8&&y<=r.y+r.h+8){const v=clamp((x-r.x)/r.w,0,1);G.oRow=i;if(i===0)VOL=Math.round(v*10)/10;else SHK=Math.round(v*10)/10;saveOpt();sfx('select');return;}}
    if(x>=OOK.x&&x<=OOK.x+OOK.w&&y>=OOK.y&&y<=OOK.y+OOK.h){G.pOpt=false;saveOpt();sfx('select');}}
  else if(G.state==='pause'){if(G.pHelp){G.pHelp=false;return;}for(let i=0;i<6;i++){const r=PRECT(i);if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){G.pmenu=i;choosePause(i);return;}}}
  else hit.add('Enter');
});
for(const b of document.querySelectorAll('#pad button[data-k]')){

(()=>{const st=document.getElementById('stick');let id=null,last='';
  const set=e=>{const r=st.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    let x=0,y=0;if(Math.hypot(dx,dy)>r.width*.12){const o=Math.round(Math.atan2(dy,dx)/(Math.PI/4));x=Math.round(Math.cos(o*Math.PI/4));y=Math.round(Math.sin(o*Math.PI/4));}
    const m=Math.hypot(x,y)||1;touchAx.x=x/m;touchAx.y=y/m;
    st.classList.toggle('l',x<0);st.classList.toggle('r',x>0);st.classList.toggle('u',y<0);st.classList.toggle('d',y>0);
    const key=x+','+y;if(key!==last){last=key;if(G.state!=='play'&&(x||y)){hit.add(Math.abs(x)>=Math.abs(y)&&x?(x>0?'TouchR':'TouchL'):(y>0?'TouchDn':'TouchUp'));}}};
  st.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();id=e.pointerId;st.setPointerCapture(id);last='';set(e);});
  st.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e);});
  const end=()=>{id=null;touchAx.x=0;touchAx.y=0;last='';st.classList.remove('l','r','u','d');};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);})();
